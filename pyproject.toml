[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anyembed"
version = "0.1.0"
description = "Embed anything (text, images, audio, video) with e5-omni-7B and search it locally"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.3",
    "torchvision",
    "transformers>=4.52.0",
    "accelerate>=0.34",
    "qwen-omni-utils",
    "pillow",
    "soundfile",
    "librosa",
    "google-genai",
    "python-dotenv",
    "chromadb>=0.5",
    "numpy",
    "textual>=0.80",
    "scikit-learn>=1.3",
    "umap-learn>=0.5",
]

[project.scripts]
anyembed = "anyembed:main"

[tool.setuptools]
py-modules = ["anyembed", "anyembed_tui", "anyembed_map"]
